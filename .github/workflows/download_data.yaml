name: Check, refresh data, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Download and preprocess the latest HDX data
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

concurrency:
  group: kenya-indicators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-refresh-deploy:
    runs-on: ubuntu-24.04
    env:
      TZ: Africa/Nairobi
      GITHUB_PAT: ${{ secrets.GH_PAT }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Install and cache R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          needs: check
          extra-packages: |
            any::devtools
            any::desc
            any::knitr
            any::remotes
            any::rmarkdown
            any::rsconnect
            github::dickoa/rhdx

      - name: Refresh and preprocess HDX data
        id: refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: Rscript data-raw/my_dataset.R

      - name: Run package tests
        id: tests
        run: Rscript -e "devtools::test(stop_on_failure = TRUE)"

      - name: Check package
        id: package_check
        run: Rscript -e "devtools::check(document = FALSE, manual = FALSE, vignettes = FALSE, error_on = 'error')"

      - name: Knit README
        id: readme
        run: Rscript -e "rmarkdown::render('README.Rmd', output_format = 'github_document')"

      - name: Commit refreshed data and README report
        id: commit_updates
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        shell: bash
        run: |
          managed_paths=(data data-raw/dhs_hdx R/doc_*.R README.md man/figures)
          if [[ -z "$(git status --porcelain -- "${managed_paths[@]}")" ]]; then
            echo "No data or README report changes to commit."
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- "${managed_paths[@]}"
          git commit -m "chore(data): refresh Kenya DHS indicators and README [skip ci]"
          git push origin HEAD:main

      - name: Install Kenya Indicators package
        if: github.event_name != 'pull_request'
        run: |
          Rscript -e "remotes::install_github('m-mburu/kenyaIndicators', upgrade = 'never')"

      - name: Deploy to shinyapps.io
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          RS_CONNECT_TOKEN: ${{ secrets.RS_CONNECT_TOKEN }}
          RS_CONNECT_SECRET: ${{ secrets.RS_CONNECT_SECRET }}
        run: Rscript dev/deploy.R

      - name: Publish run report
        if: always()
        shell: bash
        run: |
          {
            echo "## Kenya Indicators run report"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| HDX data refresh | ${{ steps.refresh.outcome }} |"
            echo "| Package tests | ${{ steps.tests.outcome }} |"
            echo "| Package check | ${{ steps.package_check.outcome }} |"
            echo "| README knitting | ${{ steps.readme.outcome }} |"
            echo "| Commit generated report | ${{ steps.commit_updates.outcome }} |"
            echo "| shinyapps.io deployment | ${{ steps.deploy.outcome }} |"
            echo
            echo "- Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Dashboard: https://mmburu.shinyapps.io/kenyaIndicators/"
          } >> "$GITHUB_STEP_SUMMARY"
